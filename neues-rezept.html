<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Neues Rezept - Rezeptbuch </title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="form.js" defer></script>
</head>

<body>
    <header>
        <a href="index.html"> Rezeptbuch </a>
        <nav aria-label="Hauptnavigation">
            <ul>
                <li>
                    <a href="index.html"> Start </a>
                </li>
                <li>
                    <a href="rezepte.html"> Rezepte </a>
                </li>
                <li>
                    <a href="neues-rezept.html" aria-current="page"> Rezept hinzufügen </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Neues Rezept erstellen</h1>

        <form id="rezept-form">

            <label for="titel">Rezeptname:</label>
            <input type="text" id="titel" name="titel">
            <small id="titel-fehler" class="fehler"></small>

            <label for="kategorie">Kategorie:</label>
            <select id="kategorie" name="kategorie">
                <option value="">Bitte auswählen</option>
                <option value="Kochen">Kochen</option>
                <option value="Backen">Backen</option>
            </select>

            <label for="ernaehrung">Ernährungsform:</label>
            <select id="ernaehrung" name="ernaehrung">
                <option value="">Bitte auswählen</option>
                <option value="vegan">Vegan</option>
                <option value="vegetarisch">Vegetarisch</option>
                <option value="fleisch">Fleisch</option>
                <option value="fisch">Fisch</option>
            </select>

            <label for="geschmack">Geschmack:</label>
            <select id="geschmack" name="geschmack">
                <option value="">Bitte auswählen</option>
                <option value="suess">Süß</option>
                <option value="herzhaft">Herzhaft</option>
            </select>

            <label for="schwierigkeit">Schwierigkeit:</label>
            <select id="schwierigkeit" name="schwierigkeit">
                <option value="">Bitte auswählen</option>
                <option value="leicht">Leicht</option>
                <option value="mittel">Mittel</option>
                <option value="schwer">Schwer</option>
            </select>

            <label for="dauer">Zubereitungszeit in Minuten:</label>
            <input type="number" id="dauer" name="dauer" min="1">
            <small id="dauer-fehler" class="fehler"></small>

            <label for="portionen">Portionen:</label>
            <input type="number" id="portionen" name="portionen" min="1">
            <small id="portionen-fehler" class="fehler"></small>

            <label>Zutaten:</label>

            <div id="zutaten-container">
                <div class="zutat">

                    <div>
                        <input type="text" class="menge" placeholder="Menge" inputmode="decimal">
                        <small class="menge-fehler fehler"></small>
                    </div>
                    <div>
                        <input type="text" class="einheit" placeholder="Einheit">
                        <small class="einheit-fehler fehler"></small>
                    </div>
                    <div>
                        <input type="text" class="zutat-name" placeholder="Zutat">
                        <small class="zutat-fehler fehler"></small>
                    </div>

                    <button type="button" class="zutat-entfernen" onclick="entferneZutat(this)">Entfernen</button>
                </div>
            </div>

            <button type="button" id="zutat-hinzufuegen">
                + Zutat hinzufügen
            </button>

            <label for="zubereitung">Zubereitung:</label>
            <textarea id="zubereitung" name="zubereitung" rows="6"></textarea>
            <small id="zubereitung-fehler" class="fehler"></small>

            <label for="bild">Bild:</label>
            <input type="file" id="bild" name="bild" accept="image/*">
            <button type="button" id="bild-entfernen" style="display: none;">
                Bild entfernen
            </button>

            <button type="button" id="formular-leeren">Formular leeren</button>

            <button type="submit">Rezept erstellen</button>

        </form>
    </main>
    <footer>
        <p> WI_A_Gruppe_2</p>
    </footer>
</body>

</html>
