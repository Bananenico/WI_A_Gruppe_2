 <!DOCTYPE html>
 <html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Rezepte - Rezeptbuch </title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>

    <body>
        <header>
            <a href="index.html"> Rezeptbuch </a>
            <nav aria-label="Hauptnavigation">
                <ul>
                    <li>
                        <a href="index.html"> Start </a>
                    </li>
                    <li>
                        <a href="rezepte.html" aria-current="page"> Rezepte </a>
                    </li>
                    <li>
                        <a href="neues-rezept.html"> Rezept hinzufügen </a>
                    </li>
                </ul>
            </nav>
        </header>

        <main>
            <h1> Alle Rezepte </h1>
            <form id ="filter-formular">
                <!-- Suchfeld mithilfe von type="search" -->
                <div>
                    <label for="suche"> Suche </label>
                    <input type="search" id="suche" name="suche" placeholder="Rezeptname oder Zutat"> 
                </div> 

                <!-- Dropdown-Menü zum Filtern der Schwierigkeit-->
                <fieldset>
                    <legend> Schwierigkeit </legend>
                    <label for="schwierigkeit"> Schwierigkeit </label>
                    <select id="schwierigkeit" name="schwierigkeit">
                        <option value="alle"> Alle </option>
                        <option value="leicht"> Leicht </option>
                        <option value="mittel"> Mittel </option>
                        <option value="schwer"> Schwer </option>
                    </select>
                </fieldset>

                <!-- Radiobuttons zum Filtern des Geschmacks-->
                <fieldset>
                    <legend> Süß oder Herzhaft </legend>
                    <label>
                        <input type="radio" name="geschmack" value="alle" checked> Alle
                    </label>
                    <label>
                        <input type="radio" name="geschmack" value="suess"> Süß
                    </label>
                    <label>
                        <input type="radio" name="geschmack" value="herzhaft"> Herzhaft
                    </label>
                </fieldset>

                <!-- Radiobuttons zum Filtern der Ernährungsart-->
                <fieldset>
                    <legend> Ernährungsart </legend>
                    <label>
                        <input type="radio" name="ernaehrung" value="alle" checked> Alle
                    </label>
                    <label>
                        <input type="radio" name="ernaehrung" value="vegan"> Vegan
                    </label>
                    <label>
                        <input type="radio" name="ernaehrung" value="vegetarisch"> Vegetarisch
                    </label>
                    <label>
                        <input type="radio" name="ernaehrung" value="fleisch"> Mit Fleisch
                    </label>
                    <label>
                        <input type="radio" name="ernaehrung" value="fisch"> Fisch
                    </label>
                </fieldset>

                <div>
                    <label for ="max-dauer"> Maximale Dauer in Minuten</label>
                    <input type="number" id="max-dauer" name="max-dauer" min="0" step="5" placeholder="z.B. 60">
                </div>

                <button type="submit"> Filtern </button>
                <button type="reset"> Filter zurücksetzen</button>
            </form>

            <!-- Ergebnisbereich, aktuell noch ohne Musterkarte. Muss fürs Testing noch hinzugefügt werden.-->
            <section aria-labelledby="ergebnisse-title">
                <h2 id="ergebnisse-title"> Ergebnisse </h2>
                <div id="rezept-liste"></div>
            </section>
        </main>
        
        <footer>
            <p> WI_A_Gruppe_2 </p>
        </footer>
    </body>
 </html>
